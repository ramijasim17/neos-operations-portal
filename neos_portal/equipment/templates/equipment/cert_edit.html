{% extends "core/base.html" %}
{% block content %}
<h1>{{ cert.equipment.serial_number }} · {{ cert.cert_type.name }}</h1>

{% if cert.file %}
  <p><a href="{{ cert.file.url }}" target="_blank">📄 View current file</a></p>
{% endif %}

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <label>Cert Number</label>
  {{ form.cert_number }}
  <label>Expiry Date</label>
  {{ form.expiry_date }}
  <label>Replace file</label>
  {{ form.file }}
  <br><br>
  <button type="submit" class="btn btn-primary">Save changes</button>
</form>
{% endblock %}
