{% extends "core/base.html" %}
{% block content %}
<h1>Delete this report?</h1>
<p class="page-sub">{{ report.job_name }} ({{ report.date }}) — this can't be undone.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn" style="border-color:var(--danger); color:var(--danger);">Yes, delete</button>
  <a class="btn" href="{% url 'daily_report:list' %}" style="margin-left:8px;">Cancel</a>
</form>
{% endblock %}
