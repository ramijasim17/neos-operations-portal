services:
  - type: web
    name: neos-operations-portal
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_default_admin"
    startCommand: "gunicorn neos_portal.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: neos-portal-db
          property: connectionString
      # Set these three in the Render dashboard's Environment tab (don't
      # commit real values to render.yaml, which is public in your repo).
      # create_default_admin.py uses them to make your first login — this
      # replaces needing Shell/SSH access, which the Free plan doesn't have.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: neos-portal-db
    plan: free
